appId: com.satsai.desktop-assistant
productName: SatsAi
directories:
  buildResources: resources
  output: release
files:
  - dist
  - dist-electron
  - resources/models/**/*
win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/assets/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
extraResources:
  - from: resources/models
    to: models
